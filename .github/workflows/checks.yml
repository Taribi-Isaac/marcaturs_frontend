name: Checks

# MH-OPS-010 — Participant SPA typecheck, lint, test and build.
#
# Runs on pull requests and is called by production.yml, so pull requests and
# main share one definition of the checks. No secrets, no environment, a
# read-only token and no deploy step: pull requests can never publish.

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
